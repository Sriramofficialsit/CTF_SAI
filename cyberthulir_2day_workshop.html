  {label:"QUICK QUIZ", color:"var(--pink)"},
];

function renderLesson(app){
  const m = MODULES[state.moduleIdx];
  const l = m.lessons[state.lessonIdx];
  const step = state.step;
  let body = "";

  if(step===0){
    body = `<div class="brief-box">${l.brief}</div>
      <div class="nav-row" style="margin-top:16px;justify-content:flex-end;">
        <button class="btn btn-primary" id="nextBtn">Continue &rarr;</button>
      </div>`;
  } else if(step===1){
    body = `<div class="concept-box">${l.concept.map(c=>`<p>${c}</p>`).join("")}</div>
      <div class="nav-row" style="margin-top:16px;justify-content:flex-end;">
        <button class="btn btn-primary" id="nextBtn">Continue &rarr;</button>
      </div>`;
  } else if(step===2){
    body = `<div class="example-title">${l.exampleTitle}</div>
      <div class="example-box">${l.example.map(p=>`<p>${p}</p>`).join("")}</div>
      <div class="nav-row" style="margin-top:16px;justify-content:flex-end;">
        <button class="btn btn-primary" id="nextBtn">Continue &rarr;</button>
      </div>`;
  } else if(step===3){
    body = renderGame(l.game);
  } else if(step===4){
    body = renderQuiz(l);
  }

  app.innerHTML = `
    <div class="card">
      <span class="step-pill" style="background:${STEP_META[step].color}">Step ${step+1} of 5 &middot; ${STEP_META[step].label}</span>
      <div class="lesson-header">Lesson ${state.moduleIdx+1}.${state.lessonIdx+1}</div>
      <div class="lesson-title">${l.title}</div>
      ${body}
    </div>
  `;

  if(step<3){
    document.getElementById("nextBtn").addEventListener("click",()=>{
      state.step++; render();
    });
  }
  if(step===3){ wireGame(l.game); }
  if(step===4){ wireQuiz(l); }
}

/* ---------- GAME RENDERING ---------- */
function renderGame(game){
  let board = "";
  if(game.type==="sort"){
    const bClass = game.buckets.length<=2?'b2':(game.buckets.length===3?'b3':'b4');
    board = `
      <div class="game-board">
        <div class="item-pool" id="itemPool">
          ${game.items.map((it,i)=>`<div class="item-chip" data-i="${i}">${it[0]}</div>`).join("")}
        </div>
        <div class="buckets ${bClass}" id="buckets">
          ${game.buckets.map((b,bi)=>`<div class="bucket" data-bucket="${b}">
            <h5>${b}</h5><div class="bucket-items"></div>
          </div>`).join("")}
        </div>
      </div>
      <div class="feedback" id="gameFeedback"></div>
      <div class="nav-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="resetGameBtn">Reset</button>
        <button class="btn btn-primary" id="gameNextBtn" disabled>Continue &rarr;</button>
      </div>`;
  } else if(game.type==="match"){
    const left = game.pairs.map((p,i)=>({t:p[0],i,side:'l'}));
    const right = game.pairs.map((p,i)=>({t:p[1],i,side:'r'})).sort(()=>Math.random()-0.5);
    board = `
      <div class="game-board">
        <div class="match-grid">
          <div class="match-col"><h5>Tap first</h5>${left.map(x=>`<div class="match-item" data-side="l" data-i="${x.i}">${x.t}</div>`).join("")}</div>
          <div class="match-col"><h5>Then tap the match</h5>${right.map(x=>`<div class="match-item" data-side="r" data-i="${x.i}">${x.t}</div>`).join("")}</div>
        </div>
      </div>
      <div class="feedback" id="gameFeedback"></div>
      <div class="nav-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="resetGameBtn">Reset</button>
        <button class="btn btn-primary" id="gameNextBtn" disabled>Continue &rarr;</button>
      </div>`;
  } else if(game.type==="order"){
    const shuffled = game.items.map((t,i)=>({t,i})).sort(()=>Math.random()-0.5);
    board = `
      <div class="game-board">
        <div class="item-pool" id="itemPool">
          ${shuffled.map(x=>`<div class="item-chip" data-i="${x.i}">${x.t}</div>`).join("")}
        </div>
        <div class="order-list" id="orderList">
          ${game.items.map((_,i)=>`<div class="order-slot" data-slot="${i}">Slot ${i+1}</div>`).join("")}
        </div>
      </div>
      <div class="feedback" id="gameFeedback"></div>
      <div class="nav-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="resetGameBtn">Reset</button>
        <button class="btn btn-primary" id="gameNextBtn" disabled>Continue &rarr;</button>
      </div>`;
  }
  return `<div class="game-title">${game.title}</div><div class="game-desc">${game.desc}</div>${board}`;
}

function wireGame(game){
  const fb = document.getElementById("gameFeedback");
  const nextBtn = document.getElementById("gameNextBtn");
  document.getElementById("resetGameBtn").addEventListener("click",()=>render());

  if(game.type==="sort"){
    let selected = null;
    let placedCount = 0;
    const total = game.items.length;
    document.querySelectorAll("#itemPool .item-chip").forEach(chip=>{
      chip.addEventListener("click",()=>{
        if(chip.classList.contains("placed")) return;
        document.querySelectorAll("#itemPool .item-chip").forEach(c=>c.classList.remove("selected"));
        chip.classList.add("selected");
        selected = chip;
      });
    });
    document.querySelectorAll("#buckets .bucket").forEach(bucket=>{
      bucket.addEventListener("click",()=>{
        if(!selected) return;
        const i = parseInt(selected.dataset.i);
        const correct = game.items[i][1] === bucket.dataset.bucket;
        const div = document.createElement("div");
        div.className = "placed-item " + (correct?"correct":"wrong");
        div.textContent = game.items[i][0] + (correct? "  ✓" : "  ✗");
        bucket.querySelector(".bucket-items").appendChild(div);
        selected.classList.add("placed");
        selected = null;
        placedCount++;
        if(!correct) loseHeart();
        if(placedCount===total){
          fb.className = "feedback show ok";
          fb.textContent = "Nice work — every item is sorted. Continue when ready.";
          nextBtn.disabled = false;
        }
      });
    });
  }

  if(game.type==="match"){
    let selL=null, selR=null;
    let matchedCount=0;
    const total = game.pairs.length;
    function tryMatch(){
      if(selL===null || selR===null) return;
      const li = parseInt(selL.dataset.i), ri = parseInt(selR.dataset.i);
      if(li===ri){
        selL.classList.remove("selected"); selR.classList.remove("selected");
        selL.classList.add("matched"); selR.classList.add("matched");
        matchedCount++;
        if(matchedCount===total){
          fb.className="feedback show ok"; fb.textContent="All matched correctly. Continue when ready.";
          nextBtn.disabled=false;
        }
      } else {
        loseHeart();
        [selL,selR].forEach(el=>{el.classList.add("wrongflash");});
        setTimeout(()=>{ [selL,selR].forEach(el=>el.classList.remove("wrongflash","selected")); },450);
      }
      selL=null; selR=null;
    }
    document.querySelectorAll('.match-item[data-side="l"]').forEach(el=>{
      el.addEventListener("click",()=>{
        if(el.classList.contains("matched")) return;
        document.querySelectorAll('.match-item[data-side="l"]').forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected"); selL=el; tryMatch();
      });
    });
    document.querySelectorAll('.match-item[data-side="r"]').forEach(el=>{
      el.addEventListener("click",()=>{
        if(el.classList.contains("matched")) return;
        document.querySelectorAll('.match-item[data-side="r"]').forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected"); selR=el; tryMatch();
      });
    });
  }

  if(game.type==="order"){
    let nextSlot = 0;
    document.querySelectorAll("#itemPool .item-chip").forEach(chip=>{
      chip.addEventListener("click",()=>{
        if(chip.classList.contains("placed")) return;
        const i = parseInt(chip.dataset.i);
        const slot = document.querySelector(`.order-slot[data-slot="${nextSlot}"]`);
        const correct = i === nextSlot;
        slot.classList.add("filled");
        slot.innerHTML = `<span class="step-no">${nextSlot+1}</span>${game.items[i]}` + (correct?" &#10003;":" &#10007;");
        slot.style.borderColor = correct? "var(--green-line)" : "#F5C2C2";
        slot.style.background = correct? "var(--green-soft)" : "var(--red-soft)";
        if(!correct) loseHeart();
        chip.classList.add("placed");
        nextSlot++;
        if(nextSlot===game.items.length){
          fb.className="feedback show ok"; fb.textContent="Sequence complete. Continue when ready.";
          nextBtn.disabled=false;
        }
      });
    });
  }

  nextBtn.addEventListener("click",()=>{ state.step++; render(); });
}

/* ---------- QUIZ ---------- */
function renderQuiz(l){
  const qi = state.quizIdx;
  const q = l.quiz[qi];
  const letters = ["A","B","C","D"];
  return `
    <div class="quiz-progress">
      ${l.quiz.map((_,i)=>`<span class="${i<qi?'done':(i===qi?'current':'')}"></span>`).join("")}
    </div>
    <div class="quiz-q">Q${qi+1}. ${q.q}</div>
    <div id="quizOpts">
      ${q.opts.map((o,i)=>`<div class="quiz-opt" data-i="${i}"><span class="letter">${letters[i]}</span>${o}</div>`).join("")}
    </div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="nav-row" style="margin-top:14px;justify-content:flex-end;">
      <button class="btn btn-primary" id="quizNextBtn" disabled>Continue &rarr;</button>
    </div>
  `;
}
function wireQuiz(l){
  const qi = state.quizIdx;
  const q = l.quiz[qi];
  const fb = document.getElementById("quizFeedback");
  const nextBtn = document.getElementById("quizNextBtn");
  let answered = false;
  document.querySelectorAll("#quizOpts .quiz-opt").forEach(opt=>{
    opt.addEventListener("click",()=>{
      if(answered) return;
      answered = true;
      const i = parseInt(opt.dataset.i);
      document.querySelectorAll("#quizOpts .quiz-opt").forEach(o=>o.classList.add("disabled"));
      if(i===q.a){
        opt.classList.add("correct");
        fb.className="feedback show ok"; fb.textContent="Correct!";
        addXP(10);
      } else {
        opt.classList.add("wrong");
        document.querySelector(`#quizOpts .quiz-opt[data-i="${q.a}"]`).classList.add("correct");
        fb.className="feedback show bad"; fb.textContent="Not quite — correct answer highlighted above.";
        loseHeart();
      }
      nextBtn.disabled = false;
    });
  });
  nextBtn.addEventListener("click",()=>{
    if(state.quizIdx < l.quiz.length-1){
      state.quizIdx++; render();
    } else {
      state.completedLessons.add(lessonKey(state.moduleIdx, state.lessonIdx));
      addXP(20);
      go("lessonComplete", {});
    }
  });
}

/* ---------- LESSON COMPLETE ---------- */
function renderLessonComplete(app){
  const m = MODULES[state.moduleIdx];
  const isLastLesson = state.lessonIdx === m.lessons.length-1;
  app.innerHTML = `
    <div class="card complete-wrap">
      <div class="complete-emoji">&#127881;</div>
      <h2>Lesson Complete!</h2>
      <p>${m.lessons[state.lessonIdx].title}</p>
      <div class="xp-pill">&#9889; +20 XP earned</div><br/>
      <button class="btn btn-primary" id="continueBtn">${isLastLesson? "Go to Practical Challenge &rarr;" : "Next Lesson &rarr;"}</button>
    </div>
  `;
  document.getElementById("continueBtn").addEventListener("click",()=>{
    if(isLastLesson){
      go("module", {});
    } else {
      go("lesson", {lessonIdx: state.lessonIdx+1, step:0, quizIdx:0});
    }
  });
}

/* ---------- CHALLENGE (TryHackMe-style simulated terminal) ---------- */
function renderChallenge(app){
  const m = MODULES[state.moduleIdx];
  const c = m.challenge;
  app.innerHTML = `
    <div class="card">
      <span class="step-pill" style="background:var(--purple)">Practical Challenge</span>
      <div class="lesson-header">Module ${m.num}</div>
      <div class="lesson-title">${c.title}</div>
      <p style="font-size:13.5px;color:var(--navy-soft);line-height:1.6;margin-top:-6px;">${c.intro}</p>
      <div class="terminal" id="termOut"><span class="prompt">redteamer@cyberthulir</span>:~$ <span style="opacity:.5">ready</span></div>
      <div class="cmd-buttons" id="cmdButtons">
        ${c.terminal.map((t,i)=>`<button class="cmd-btn" data-i="${i}">${t.cmd}</button>`).join("")}
      </div>
      <div id="answerArea" class="hidden">
        <p style="font-size:13px;font-weight:800;color:var(--navy);margin-bottom:8px;">${c.question}</p>
        <div class="answer-row">
          <input type="text" class="answer-input" id="answerInput" placeholder="Type your answer...">
          <button class="btn btn-primary" id="submitAnswerBtn">Submit</button>
        </div>
        <div class="feedback" id="challengeFeedback"></div>
      </div>
    </div>
  `;
  const term = document.getElementById("termOut");
  let runCount = 0;
  document.querySelectorAll("#cmdButtons .cmd-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i = parseInt(btn.dataset.i);
      const t = c.terminal[i];
      term.innerHTML += `\n<span class="prompt">redteamer@cyberthulir</span>:~$ <span class="cmd">${t.cmd}</span>\n<span class="out">${t.out}</span>`;
      term.scrollTop = term.scrollHeight;
      btn.classList.add("used"); btn.disabled = true;
      runCount++;
      if(runCount===c.terminal.length){
        document.getElementById("answerArea").classList.remove("hidden");
      }
    });
  });
  document.getElementById("submitAnswerBtn")?.addEventListener("click", submitChallengeAnswer);
  document.getElementById("answerInput")?.addEventListener("keydown", e=>{ if(e.key==="Enter") submitChallengeAnswer(); });
}
function submitChallengeAnswer(){
  const m = MODULES[state.moduleIdx];
  const c = m.challenge;
  const val = document.getElementById("answerInput").value.trim().toLowerCase();
  const fb = document.getElementById("challengeFeedback");
  const ok = c.accept.some(tok=>val.includes(tok));
  if(ok){
    fb.className="feedback show ok";
    fb.innerHTML = c.successMsg;
    document.getElementById("submitAnswerBtn").disabled = true;
    document.getElementById("answerInput").disabled = true;
    state.completedModules.add(state.moduleIdx);
    addXP(c.xp);
    setTimeout(()=> go("moduleComplete", {}), 900);
  } else {
    fb.className="feedback show bad";
    fb.textContent = "Not quite. Hint: " + c.hint;
    loseHeart();
  }
}

/* ---------- MODULE COMPLETE ---------- */
function renderModuleComplete(app){
  const m = MODULES[state.moduleIdx];
  const nextLocked = state.moduleIdx === MODULES.length-1;
  app.innerHTML = `
    <div class="card complete-wrap">
      <div class="complete-emoji">&#127942;</div>
      <h2>Module Complete!</h2>
      <p>${m.title}</p>
      <div class="badge-card">
        <div class="icon">&#127942;</div>
        <div style="text-align:left;"><b>${m.challenge.badge}</b><span>Badge unlocked</span></div>
      </div><br/>
      <div class="xp-pill">&#9889; +${m.challenge.xp} XP earned</div><br/>
      <button class="btn btn-primary" id="continueBtn">${nextLocked? "Back to Path" : "Continue to Module "+MODULES[state.moduleIdx+1].num+" &rarr;"}</button>
    </div>
  `;
  document.getElementById("continueBtn").addEventListener("click",()=>{
    state.history = [];
    go("home", {});
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
