<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberThulir — 2-Day Workshop (Beginner)</title>
<style>
:root{
  --navy:#131A2B; --navy-soft:#33405C; --ink:#1C2333;
  --pink:#EC1E79; --pink-soft:#FDE9F1; --pink-line:#F7C9DE;
  --purple:#7C3AED; --purple-soft:#F1EBFC; --purple-line:#DCC9F7;
  --green:#16A34A; --green-soft:#E9F7EF; --green-line:#BEE6CC;
  --amber:#D97706; --amber-soft:#FEF3E2;
  --red:#DC2626; --red-soft:#FDECEC;
  --grey:#6B7280; --grey-line:#E3E6EC; --bg-card:#F7F8FB;
  --white:#ffffff;
  --radius:16px; --radius-sm:10px;
  --shadow: 0 1px 2px rgba(19,26,43,.06), 0 8px 24px rgba(19,26,43,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  background:#F4F5F9;
  color:var(--ink);
  min-height:100vh;
}
#app{max-width:920px;margin:0 auto;padding:0 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--pink-soft);}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--white);
  border-bottom:1px solid var(--grey-line);
  padding:10px 0;
  margin-bottom:18px;
}
.topbar-inner{max-width:920px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--navy);white-space:nowrap;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--navy-soft);background:var(--bg-card);border:1px solid var(--grey-line);border-radius:999px;padding:5px 11px;}
.stat.hearts{color:var(--red);}
.stat.xp{color:var(--pink);}
.progressbar-wrap{flex:1;height:8px;background:var(--grey-line);border-radius:999px;overflow:hidden;}
.progressbar-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:999px;transition:width .4s ease;}
.backbtn{background:none;border:none;color:var(--navy-soft);font-size:13px;font-weight:700;padding:6px 4px;}
.backbtn:hover{color:var(--pink);}

/* ---------- path (home) view ---------- */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,#1c2745 100%);
  border-radius:20px;color:#fff;padding:28px 26px;margin-bottom:22px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.55),transparent 70%);}
.hero h1{margin:0 0 6px;font-size:22px;position:relative;}
.hero p{margin:0;color:#C7CCDA;font-size:13.5px;max-width:520px;position:relative;line-height:1.5;}
.hero-stats{display:flex;gap:22px;margin-top:16px;position:relative;flex-wrap:wrap;}
.hero-stats div{font-size:12px;color:#9AA3B8;}
.hero-stats b{display:block;color:#fff;font-size:19px;}

.path{display:flex;flex-direction:column;gap:10px;}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px;}
.day-head span{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;border-radius:999px;padding:7px 15px;}
.day-head small{color:var(--grey);font-weight:700;font-size:12px;}
.day-head.day2 span{background:linear-gradient(135deg,var(--navy),var(--navy-soft));}
.module-row{
  display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--grey-line);
  border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
  transition:transform .15s ease;cursor:pointer;
}
.module-row:hover{transform:translateY(-2px);}
.module-row.locked{opacity:.55;cursor:not-allowed;}
.module-row.locked:hover{transform:none;}
.m-badge{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}
.m-badge.done{background:linear-gradient(135deg,var(--green),#0f9c58);}
.m-badge.locked{background:#C9CDD8;}
.m-info{flex:1;min-width:0;}
.m-info h3{margin:0 0 2px;font-size:14.5px;color:var(--navy);}
.m-info p{margin:0;font-size:12px;color:var(--grey);}
.m-meta{font-size:11px;color:var(--grey);white-space:nowrap;}
.m-check{font-size:20px;color:var(--green);}
.m-lock{font-size:16px;color:#AEB4C2;}

/* ---------- module detail view ---------- */
.module-head{
  background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;
}
.module-head .kicker{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--pink);text-transform:uppercase;}
.module-head h2{margin:6px 0 4px;font-size:20px;}
.module-head p{margin:0;color:#C7CCDA;font-size:13px;}

.lesson-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.lesson-row{
  display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--grey-line);
  border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
}
.lesson-row.locked{opacity:.5;cursor:not-allowed;}
.l-num{
  width:34px;height:34px;border-radius:10px;background:var(--pink-soft);color:var(--pink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;
}
.l-num.done{background:var(--green-soft);color:var(--green);}
.l-title{flex:1;font-size:13.5px;font-weight:700;color:var(--navy);}
.l-sub{font-size:11px;color:var(--grey);}

.challenge-card{
  background:var(--purple-soft);border:1px solid var(--purple-line);border-radius:14px;padding:16px;
  display:flex;align-items:center;gap:14px;cursor:pointer;
}
.challenge-card.locked{opacity:.55;cursor:not-allowed;}
.challenge-icon{font-size:22px;}
.challenge-card h4{margin:0 0 2px;font-size:13.5px;color:var(--navy);}
.challenge-card p{margin:0;font-size:12px;color:var(--navy-soft);}

/* ---------- lesson flow ---------- */
.card{
  background:var(--white);border:1px solid var(--grey-line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.step-pill{
  display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:10.5px;
  letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:8px;margin-bottom:12px;
}
.lesson-header{font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.lesson-title{font-size:18px;font-weight:800;color:var(--navy);margin:0 0 14px;}

.brief-box{background:var(--pink-soft);border:1px solid var(--pink-line);border-radius:12px;padding:14px 16px;font-style:italic;color:var(--navy);font-size:14px;line-height:1.55;}
.concept-box{background:var(--bg-card);border:1px solid var(--grey-line);border-radius:12px;padding:14px 16px;}
.concept-box p{font-size:13.5px;line-height:1.6;color:var(--navy-soft);margin:0 0 10px;}
.concept-box p:last-child{margin-bottom:0;}
.concept-box b{color:var(--navy);}
.example-title{font-weight:800;font-size:14.5px;color:var(--navy);margin:0 0 8px;}
.example-box p{font-size:13.5px;line-height:1.65;color:var(--navy-soft);margin:0 0 10px;}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.btn{
  border:none;border-radius:12px;padding:12px 22px;font-weight:800;font-size:13.5px;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s ease,filter .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{background:#D7D2E8;cursor:not-allowed;}
.btn-ghost{background:none;color:var(--navy-soft);border:1px solid var(--grey-line);}
.btn-ghost:hover{background:var(--bg-card);}
.btn-green{background:var(--green);color:#fff;}

/* ---------- game screens ---------- */
.game-title{font-size:16px;font-weight:800;color:var(--navy);margin:0 0 4px;}
.game-desc{font-size:13px;color:var(--grey);margin:0 0 16px;}
.game-board{display:flex;flex-direction:column;gap:16px;}

.item-pool{display:flex;flex-wrap:wrap;gap:8px;}
.item-chip{
  background:var(--white);border:2px solid var(--grey-line);border-radius:10px;padding:9px 14px;
  font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:all .15s ease;user-select:none;
}
.item-chip:hover{border-color:var(--purple);}
.item-chip.selected{border-color:var(--purple);background:var(--purple-soft);}
.item-chip.placed{opacity:0;pointer-events:none;height:0;padding:0;border:0;margin:0;overflow:hidden;}

.buckets{display:grid;gap:10px;}
.buckets.b2{grid-template-columns:1fr 1fr;}
.buckets.b3{grid-template-columns:1fr 1fr 1fr;}
.buckets.b4{grid-template-columns:1fr 1fr;}
@media(max-width:620px){.buckets.b3{grid-template-columns:1fr;} .buckets.b4{grid-template-columns:1fr;}}
.bucket{
  border:2px dashed var(--grey-line);border-radius:12px;padding:10px;min-height:96px;background:var(--bg-card);
  transition:border-color .15s ease,background .15s ease;
}
.bucket.dragover{border-color:var(--purple);background:var(--purple-soft);}
.bucket h5{margin:0 0 8px;font-size:11.5px;font-weight:800;color:var(--navy-soft);text-transform:uppercase;letter-spacing:.03em;}
.bucket .placed-item{
  background:#fff;border:1px solid var(--grey-line);border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
}
.bucket .placed-item.correct{border-color:var(--green-line);background:var(--green-soft);color:#0f6b32;}
.bucket .placed-item.wrong{border-color:#F5C2C2;background:var(--red-soft);color:#8a1f1f;}

.order-list{display:flex;flex-direction:column;gap:8px;}
.order-slot{
  border:2px dashed var(--grey-line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--grey);
  min-height:20px;background:var(--bg-card);
}
.order-slot.filled{border-style:solid;border-color:var(--purple-line);background:#fff;color:var(--navy);font-weight:700;display:flex;gap:10px;align-items:center;}
.order-slot .step-no{width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col h5{font-size:11px;text-transform:uppercase;color:var(--grey);margin:0 0 8px;letter-spacing:.04em;}
.match-item{
  background:#fff;border:2px solid var(--grey-line);border-radius:10px;padding:10px 12px;font-size:12.5px;
  margin-bottom:8px;cursor:pointer;transition:all .15s ease;
}
.match-item.selected{border-color:var(--purple);background:var(--purple-soft);}
.match-item.matched{border-color:var(--green-line);background:var(--green-soft);color:#0f6b32;cursor:default;}
.match-item.wrongflash{border-color:#F5C2C2;background:var(--red-soft);}

.feedback{margin-top:14px;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:var(--green-soft);color:#0f6b32;border:1px solid var(--green-line);}
.feedback.bad{background:var(--red-soft);color:#8a1f1f;border:1px solid #F5C2C2;}

/* ---------- quiz ---------- */
.quiz-q{font-size:14.5px;font-weight:800;color:var(--navy);margin:0 0 12px;}
.quiz-opt{
  display:flex;align-items:center;gap:10px;border:2px solid var(--grey-line);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:13.5px;color:var(--navy-soft);transition:all .15s ease;
}
.quiz-opt:hover{border-color:var(--purple);}
.quiz-opt .letter{width:22px;height:22px;border-radius:50%;border:2px solid var(--grey-line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:var(--grey);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-soft);color:#0f6b32;}
.quiz-opt.correct .letter{border-color:var(--green);background:var(--green);color:#fff;}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:#8a1f1f;}
.quiz-opt.wrong .letter{border-color:var(--red);background:var(--red);color:#fff;}
.quiz-opt.disabled{pointer-events:none;}
.quiz-progress{display:flex;gap:5px;margin-bottom:14px;}
.quiz-progress span{flex:1;height:5px;border-radius:99px;background:var(--grey-line);}
.quiz-progress span.done{background:var(--green);}
.quiz-progress span.current{background:var(--purple);}

/* ---------- challenge / terminal ---------- */
.terminal{
  background:#0c1220;color:#c9f7d4;border-radius:12px;padding:16px;font-family:'Consolas','Monaco',monospace;
  font-size:12.5px;line-height:1.65;overflow-x:auto;white-space:pre-wrap;margin-bottom:14px;
}
.terminal .prompt{color:#7dd3fc;}
.terminal .cmd{color:#fde68a;}
.terminal .out{color:#c9f7d4;}
.cmd-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.cmd-btn{
  background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:12px;font-family:'Consolas','Monaco',monospace;
}
.cmd-btn:disabled{background:#C9CDD8;color:#fff;cursor:not-allowed;}
.cmd-btn.used{background:#3a4560;}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;}
.answer-input{
  flex:1;min-width:220px;border:2px solid var(--grey-line);border-radius:10px;padding:11px 14px;font-size:13.5px;
}
.answer-input:focus{outline:none;border-color:var(--purple);}

/* ---------- badge / complete screens ---------- */
.complete-wrap{text-align:center;padding:30px 10px;}
.complete-emoji{font-size:54px;margin-bottom:6px;}
.complete-wrap h2{margin:0 0 6px;font-size:20px;color:var(--navy);}
.complete-wrap p{color:var(--grey);font-size:13.5px;margin:0 0 18px;}
.xp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--pink-soft);color:var(--pink);font-weight:800;border-radius:999px;padding:8px 18px;font-size:14px;margin-bottom:22px;}
.badge-card{
  display:inline-flex;align-items:center;gap:12px;background:var(--green-soft);border:1px solid var(--green-line);
  border-radius:14px;padding:14px 22px;margin-bottom:22px;
}
.badge-card .icon{font-size:26px;}
.badge-card b{color:var(--navy);font-size:14px;display:block;}
.badge-card span{color:var(--grey);font-size:11.5px;}

/* hearts lost shake */
@keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
.shake{animation:shake .5s;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <button class="backbtn" id="backBtn">&larr; Back</button>
    <div class="brand"><span class="dot"></span>CyberThulir</div>
    <div class="progressbar-wrap"><div class="progressbar-fill" id="topProgress" style="width:0%"></div></div>
    <div class="stat hearts">&#9829; <span id="heartsVal">5</span></div>
    <div class="stat xp">&#9889; <span id="xpVal">0</span> XP</div>
  </div>
</div>

<div id="app"></div>

<script>
/* =========================================================================
   DATA — Beginner Tier (10 modules / 30 lessons / 10 practical challenges)
   ========================================================================= */
const MODULES = [
{
  id:0, num:"01", day:1, title:"Introduction to Ethical Hacking & Red Team Fundamentals",
  focus:"What ethical hacking is, the domains it covers, testing types, and red team fundamentals.",
  lessons:[
    {
      title:"What Is Ethical Hacking?",
      brief:"Before any tools, learn what makes hacking 'ethical' — and what ethical hackers actually do day to day.",
      concept:[
        "<b>Ethical hacking</b> is the authorized practice of testing systems, networks and applications to identify and fix security weaknesses before malicious attackers exploit them. Ethical hackers use real hacking techniques — with permission — to strengthen cybersecurity and protect digital assets.",
        "<b>Works of ethical hackers:</b>",
        "<b>1. Penetration testing</b> — conducts controlled tests that simulate real-world attacks to evaluate how well security controls hold up.",
        "<b>2. Vulnerability assessment</b> — performs systematic reviews to identify misconfigurations, software flaws and exploitable weaknesses.",
        "<b>3. Network & application analysis</b> — analyzes network and application security to detect attack vectors and unauthorized access risks.",
        "<b>4. Remediation & retesting</b> — provides remediation recommendations and validates security fixes through controlled retesting."
      ],
      exampleTitle:"Nimbus Health Hires Testers",
      example:[
        "Nimbus Health suspects its patient portal could be attacked. Instead of waiting for criminals, it hires ethical hackers with written permission to attack the portal first.",
        "The team runs a penetration test, lists the misconfigurations they find, recommends fixes, and then retests to confirm each fix actually works."
      ],
      game:{type:"match", title:"Match the Ethical Hacker Task",
        desc:"Tap a task, then tap what it means.",
        pairs:[
          ["Penetration testing","Simulate real-world attacks, evaluate controls"],
          ["Vulnerability assessment","Find misconfigurations and software flaws"],
          ["Network & app analysis","Detect attack vectors and access risks"],
          ["Remediation & retesting","Recommend fixes, then verify they work"],
        ]},
      quiz:[
        {q:"Ethical hacking is best described as:",opts:["Unauthorized testing for fun","Authorized testing to find and fix weaknesses before attackers do","Malware development","Bypassing all security controls"],a:1},
        {q:"Which task evaluates how well security controls hold up under a simulated attack?",opts:["Vulnerability assessment","Penetration testing","Password reset","Software installation"],a:1},
        {q:"After recommending fixes, ethical hackers:",opts:["Move on immediately","Validate the fixes through controlled retesting","Delete the report","Publish the flaws online"],a:1},
      ]
    },
    {
      title:"Hacking Domains & Testing Types",
      brief:"Hacking splits into domains by target — and into box types by how much the tester is told.",
      concept:[
        "<b>Types by domain:</b>",
        "<b>Web Application Hacking</b> — finding flaws in websites, web apps, and APIs.",
        "<b>Network Hacking</b> — analyzing wired and wireless networks, routers, switches, and firewalls.",
        "<b>Cloud Hacking</b> — securing cloud environments like AWS, Microsoft Azure, and Google Cloud.",
        "<b>System Hacking</b> — targeting Windows, Linux or macOS to gain administrative access, steal local data, or escalate privileges on a local machine.",
        "<b>Mobile Application Hacking</b> — finding flaws in iOS and Android applications.",
        "<b>Social Engineering</b> — targets the human element rather than software.",
        "<b>IoT Hacking</b> — tests smart devices like smart cameras, routers, or medical devices.",
        "<b>Types by methodology:</b>",
        "<b>Black Box Testing</b> — a blind, realistic attack from an external cybercriminal. The tester gets zero prior knowledge — often only a company name or an IP range.",
        "<b>Grey Box Testing</b> — an attack from a limited insider, such as a rogue employee or contractor. The tester gets partial knowledge, such as standard user login credentials.",
        "<b>White Box Testing</b> — a deep review by an insider with administrative access, like a developer. The tester gets full knowledge, including complete source code."
      ],
      exampleTitle:"Choosing the Right Box",
      example:[
        "Nimbus Health wants a security test. Given only the company name and a domain, testers work Black Box — knowing as little as an outsider would.",
        "Given a normal user login as well, it becomes Grey Box. Given full source code and server access, it is White Box — thorough, but least like a real attacker."
      ],
      game:{type:"match", title:"Match the Testing Type",
        desc:"Tap a testing type, then tap what it means.",
        pairs:[
          ["Black Box Testing","Zero prior knowledge — only a name or IP range"],
          ["Grey Box Testing","Partial knowledge, such as standard user credentials"],
          ["White Box Testing","Full knowledge including complete source code"],
          ["Social Engineering","Targets the human element, not software"],
          ["Cloud Hacking","Secures AWS, Azure, and Google Cloud"],
        ]},
      quiz:[
        {q:"Which domain targets the human element rather than software?",opts:["Network Hacking","Cloud Hacking","Social Engineering","System Hacking"],a:2},
        {q:"In black-box testing the tester receives:",opts:["Complete source code","Standard user credentials","Zero prior knowledge","Administrator access"],a:2},
        {q:"Grey-box testing simulates an attack from:",opts:["A blind external criminal","A limited insider with partial knowledge","A developer with source code","An automated scanner"],a:1},
        {q:"IoT hacking tests the security of:",opts:["Web APIs only","Smart devices like cameras, routers, medical devices","Email servers","Desktop printers only"],a:1},
      ]
    },
    {
      title:"Introduction to Red Teaming",
      brief:"Red teams don't just find flaws — they act like real attackers to test detection and response.",
      concept:[
        "<b>Red teaming</b> is the authorized practice of simulating real-world cyberattacks to test how well an organization can prevent, detect, and respond to attackers. Red teams act like real attackers, with permission, to identify weaknesses in systems, networks, applications, and security controls.",
        "<b>Works of red teamers:</b>",
        "<b>1.</b> Simulate real-world attacks to test the organization's security defenses.",
        "<b>2.</b> Identify weaknesses in systems, networks, applications, and user security.",
        "<b>3.</b> Test whether security teams can detect, investigate, and respond to simulated attacks.",
        "<b>4.</b> Attempt to gain access and move through systems within the agreed scope and rules.",
        "<b>5.</b> Provide detailed findings and recommendations to improve security and reduce risks."
      ],
      exampleTitle:"The Debrief That Mattered",
      example:[
        "A red team quietly gained access to a client's file server over two weeks — and the client's defenders never noticed. That silence was the real finding.",
        "The team reported not just the open door, but the missed detections, with recommendations for monitoring, alerting, and response drills."
      ],
      game:{type:"match", title:"Match the Red Team Task",
        desc:"Tap a red team task, then tap its purpose.",
        pairs:[
          ["Simulate real-world attacks","Test whether defenses actually hold"],
          ["Identify weaknesses","Find gaps in systems, networks, users"],
          ["Test detection & response","See if defenders notice and react"],
          ["Move within scope & rules","Gain access only as agreed"],
          ["Report findings","Recommend improvements, reduce risk"],

  id:1, num:"02", day:1, title:"Ethical Hacking Methodology and Attack Lifecycle",
  focus:"The 6-phase ethical hacking methodology and the 7-stage cyber attack lifecycle.",
  lessons:[
    {
      title:"Phases of Ethical Hacking",
      brief:"Ethical hacking follows a structured, authorized methodology: identify, validate, then help remediate.",
      concept:[
        "Ethical hacking follows a structured and authorized methodology designed to identify, validate, and help remediate security weaknesses before malicious attackers can exploit them.",
        "<b>1. Planning</b> — defines the scope, objectives, target assets, testing methodology, authorization, and rules of engagement for the security assessment.",
        "<b>2. Reconnaissance (Information Gathering)</b> — collects information about domains, IP ranges, technologies, services, employees, and publicly available information to understand the target's attack surface.",
        "<b>3. Scanning and Enumeration</b> — identifies live hosts, open ports, running services, technologies, configurations, and potential vulnerabilities through appropriate scanning and enumeration techniques.",
        "<b>4. Gaining Access (Exploitation)</b> — safely validates identified vulnerabilities by attempting controlled exploitation to assess their actual security impact.",
        "<b>5. Post-Exploitation</b> — evaluates the potential impact of successful access, including privilege escalation, lateral movement, access to sensitive resources, and the effectiveness of security controls. Testing is performed only within the authorized scope.",
        "<b>6. Reporting and Remediation</b> — documents verified vulnerabilities, attack paths, evidence, risk ratings, business impact, and prioritized recommendations for remediation. Retesting may be performed to verify that identified issues have been addressed."
      ],
      exampleTitle:"From Plan to Report",
      example:[
        "A team is engaged to test Nimbus Health's perimeter. They begin with Planning, confirming scope and a signed authorization before sending a single packet.",
        "Recon and scanning reveal a weak service, which they exploit under control. Post-exploitation shows how far they could move, and Reporting turns it all into evidence with risk ratings and prioritised fixes."
      ],
      game:{type:"order", title:"Order the Methodology",

      quiz:[

        {q:"What comes immediately after Scanning & Enumeration?",opts:["Reporting","Gaining Access","Planning","Remediation"],a:1},
        {q:"Post-exploitation testing is performed:",opts:["Anywhere on the internet","Only within the authorized scope","After the report is delivered","Only on Linux systems"],a:1},
        {q:"The Reporting phase documents all EXCEPT:",opts:["Verified vulnerabilities and evidence","Risk ratings and business impact","Prioritized remediation recommendations","The tester's personal opinions on staff"],a:3},
      ]
    },
    {
      title:"Cyber Attack Life Cycle",
      brief:"Attackers follow stages too — learn their lifecycle so you can break it.",
      concept:[
        "The <b>Cyber Attack Life Cycle</b> is a framework that describes the typical stages an attacker may follow to plan, execute, and achieve objectives during a cyberattack.",
        "<b>1. Reconnaissance</b> — the attacker gathers information about the target, such as domains, email addresses, technologies, network infrastructure, and potential vulnerabilities.",
        "<b>2. Weaponization</b> — the attacker prepares a malicious payload by combining an exploit or malicious code with a delivery mechanism.",
        "<b>3. Delivery</b> — the weaponized payload is delivered to the target through phishing emails, compromised websites, malicious downloads, or removable media.",
        "<b>4. Exploitation</b> — the attacker exploits a vulnerability, security weakness, or user interaction to execute unauthorized code or actions on the target system.",
        "<b>5. Installation</b> — malware, backdoors, or other mechanisms may be installed to establish continued access to the compromised system.",
        "<b>6. Command and Control (C2)</b> — the compromised system establishes communication with attacker-controlled infrastructure, allowing the attacker to issue commands or manage the compromised environment.",
        "<b>7. Actions on Objectives</b> — the attacker attempts to achieve their ultimate objective, such as stealing sensitive information, disrupting operations, deploying ransomware, or damaging systems."
      ],
      exampleTitle:"A Phishing Attack, Stage by Stage",

  id:4, num:"05", day:1, title:"Technology & Web Application Fingerprinting",
  focus:"Passive vs active fingerprinting, the five signals to read, why it matters, and the tools.",
  lessons:[
    {
      title:"Passive vs Active Fingerprinting",
      brief:"Once you can reach a target, ask: what exactly is running behind it — quietly or loudly?",
      concept:[
        "<b>Web Application Fingerprinting</b> — the process of gathering detailed information about a target website's underlying software, frameworks, operating systems, and hardware architectures.",
        "<b>Passive Fingerprinting</b> — information gathering that relies on analyzing publicly available data and normal traffic without sending aggressive requests to the target (e.g., inspecting source code, public cookies, or standard headers).",
        "<b>Active Fingerprinting</b> — information gathering that involves sending specifically crafted packets or requests to the target to observe how it responds (e.g., forcing error pages or probing hidden directories).",
        "<b>How they work together:</b>",
        "<b>The Request</b> — you or a scanner request a webpage from the target server.",
        "<b>The Response</b> — the server sends back HTML code, HTTP headers, cookies, and scripts.",
        "<b>The Analysis</b> — fingerprinting tools parse these components looking for distinct signatures, such as unique code comments, specific folder structures, or header values.",
        "<b>The Identification</b> — the tool matches these signatures against a database to reveal exactly what software versions and operating systems the site is running."
      ],
      exampleTitle:"Two Headers, Two Answers",
      example:[
        "A curl -I request to a target returns 'Server: nginx/1.18.0' and 'X-Powered-By: PHP/7.4'. Those headers alone name the web server and the backend language.",
        "Reading the page source reveals a WordPress generator tag, confirming the CMS. A blank URL becomes a mapped technology stack — ready for version and CVE checks."
      ],

  id:5, num:"06", day:1, title:"Network & Service Enumeration using Nmap",
  focus:"Nmap basics and port states, scan syntax, why enumeration matters, and core Nmap commands.",
  lessons:[
    {
      title:"Enumeration Basics & Port States",
      brief:"You cannot attack what you cannot see — enumeration turns a network range into living services.",
      concept:[
        "<b>Network Enumeration</b> — the process of discovering active hosts, open ports, and available services within a target network to map its structural layout.",
        "<b>Service Enumeration</b> — the process of identifying the exact applications, protocols, and software versions running on discovered open ports.",
        "<b>Nmap (Network Mapper)</b> — an open-source security tool used for network discovery, service fingerprinting, and vulnerability detection.",
        "<b>Port States</b> — the status of a communication gateway on a device, categorized by Nmap to indicate availability:",
        "<b>Open</b> — an application is actively accepting connections on this port.",
        "<b>Closed</b> — the port is accessible, but no application is currently listening on it.",
        "<b>Filtered</b> — a firewall, filter, or network obstacle is blocking Nmap from reaching the port to determine its state.",
        "<b>How they work together:</b>",
        "<b>Host Discovery</b> — Nmap sends initial packets (like ping requests) to find out which machines are powered on and connected to the network.",
        "<b>Port Scanning</b> — for each active host, Nmap probes specific ports to check if they are open, closed, or filtered.",
        "<b>Service Interrogation</b> — Nmap interacts directly with open ports by sending specific application-layer probes and listening for response data.",
        "<b>Banner Grabbing</b> — the tool reads the welcome messages (banners) returned by the service to extract the exact application name and version details.",
        "<b>OS Detection</b> — Nmap analyzes subtle differences in how the target operating system responds to network packets to guess the OS version."
      ],
      exampleTitle:"Reading an Nmap Report",
      example:[
        "nmap -sV -p 22,80,443 203.0.113.10 reveals: port 22 open (OpenSSH), port 80 open (nginx), port 443 open (nginx) — a web server with remote administration.",
        "Host discovery found the machine alive, port scanning classified each port, interrogation and banner grabs named the versions, and OS detection guessed the platform."
      ],
      game:{type:"sort", title:"Open, Closed or Filtered?",
        desc:"Tap a scan result, then tap its port state.",
        buckets:["Open","Closed","Filtered"],
        items:[
          ["57/tcp open ssh","Open"],
          ["443/tcp open https","Open"],
          ["21/tcp closed ftp","Closed"],
          ["8080/tcp filtered n-proxy","Filtered"],

        ]},

    {
      title:"Understanding Nmap Scan Syntax",
      brief:"Every Nmap command is built from six blocks: target, technique, version, ports, timing, output.",
      concept:[
        "Analyzing the core components of an Nmap command to control scan behavior, speed, and output.",
        "<b>Target Specification</b> — the destination IP address (e.g., 192.168.1.1), domain name, or entire network range (e.g., 192.168.1.0/24) you want to scan.",
        "<b>Scan Technique Flags</b> — instructions determining how Nmap handles connection handshakes (like -sS for Stealth/SYN scans or -sT for full TCP Connect scans).",
        "<b>Service & Version Flags</b> — toggles dedicated to interrogating services, such as -sV, which forces Nmap to probe open ports to determine service and version info.",
        "<b>Port Selection Flags</b> — controls which ports are tested, using -p followed by specific numbers (like -p 80,443) or -p- to scan all 65,335 possible ports.",
        "<b>Timing Templates</b> — performance modifiers ranging from -T0 (paranoid/slow) to -T5 (insanely fast) that adjust packet speed to bypass network congestion or detection.",
        "<b>Output Formats</b> — directives that save your results into standard files (-oN) or easily searchable formats (-oG for grepable output)."
      ],
      exampleTitle:"Building a Command",

    {

    {

      brief:"Three commands that cover host discovery, deep interrogation, and vulnerability checks.",
      concept:[
        "<b>nmap -sn 192.168.1.0/24</b>",
        "<b>nmap</b> — launches the Network Mapper tool.",
        "<b>-sn</b> — disables port scanning, performing a ping scan purely for host discovery to see which machines are online.",
        "<b>192.168.1.0/24</b> — specifies the entire local subnet range to scan.",
        "<b>nmap -sS -sV -O 192.168.1.50</b>",
        "<b>-sS</b> — conducts a TCP SYN scan (Stealth Scan) by half-opening connections to avoid logging.",
        "<b>-sV</b> — enables Service Version Detection, actively probing open ports to determine service names and exact version details.",

  id:6, num:"07", day:2, title:"Introduction to Vulnerability Assessment",
  focus:"What vulnerabilities and assessments are, the six assessment types, why they matter, and the lifecycle.",
  lessons:[
    {
      title:"Vulnerabilities & Assessment Basics",
      brief:"A vulnerability is a weakness; an assessment is the structured hunt for it.",
      concept:[
        "<b>What is Vulnerability?</b> — a weakness in a system, application, network, configuration, or process that could potentially be exploited and result in unauthorized access, data exposure, disruption, or other security impacts.",
        "Vulnerabilities can occur because of software defects, outdated systems, insecure configurations, weak security controls, or other weaknesses in an organization's environment.",
        "<b>What is Vulnerability Assessment?</b> — a structured process used to identify and evaluate security weaknesses within a defined environment. It helps organizations understand where weaknesses exist, assess their potential significance, and determine which issues require attention.",
        "<b>Vulnerability assessments can cover:</b> Networks, Servers, End-user devices, Web applications, APIs, Databases, Cloud environments, Network devices, and Software and applications.",
        "<b>A typical assessment follows a continuous process:</b> Discover → Identify → Analyze → Prioritize → Remediate → Verify → Monitor."
      ],
      exampleTitle:"One Weakness, Many Doors",
      example:[
        "An outdated VPN (software defect) with a default password (weak control) on an unpatched server (outdated system) — three causes, one vulnerability.",
        "A vulnerability assessment discovers it, analyzes its significance, and queues it for remediation before attackers knock."
      ],
      game:{type:"match", title:"Match the Assessment Term",
        desc:"Tap a term, then tap what it means.",
        pairs:[
          ["Vulnerability","A weakness that could be exploited"],
          ["Vulnerability assessment","Structured process to find and evaluate weaknesses"],
          ["Discover → Identify → Analyze","First half of the continuous process"],
          ["Prioritize → Remediate","Decide order, then fix"],
          ["Verify → Monitor","Confirm fixes, keep watching"],
        ]},

        {q:"Vulnerabilities can occur because of all EXCEPT:",opts:["Software defects","Insecure configurations","Weak security controls","Strong access controls"],a:3},
        {q:"Which areas can a vulnerability assessment cover?",opts:["Only web applications","Networks, servers, devices, apps, APIs, databases, cloud and more","Only passwords","Only physical locks"],a:1},

    {
      title:"Why Assessment Matters",
      brief:"Five reasons organizations assess again and again.",
      concept:[
        "Organizations continuously introduce new systems, applications, software, services, and cloud resources. At the same time, new vulnerabilities are discovered regularly. Regular assessment keeps visibility into this changing environment.",
        "<b>1. Identify security weaknesses</b> — helps discover weaknesses that may otherwise remain unnoticed; finding them early gives a chance to address them before they contribute to an incident.",
        "<b>2. Reduce attack surface</b> — identifying unnecessary services, outdated software, exposed systems, and insecure configurations reduces opportunities for unauthorized access.",

    {
      title:"The Assessment Lifecycle",
      brief:"Eight steps, end to end — and it never really ends.",
      concept:[
        "Vulnerability assessment is a continuous process — from discovery through verification.",
        "<b>1. Define Scope</b> — determine which systems, applications, networks, devices, and resources are included. A clear scope keeps the assessment authorized, focused, and appropriate.",
        "<b>2. Discover Assets</b> — identify the assets in scope: servers, workstations, network devices, applications, databases, cloud resources. An accurate inventory prevents systems from being overlooked.",
        "<b>3. Identify Vulnerabilities</b> — use appropriate tools and techniques: automated scanning, configuration assessment, application testing, or other authorized techniques.",
        "<b>4. Analyze Findings</b> — review vulnerabilities to understand characteristics and consequences: severity, exploitability, exposure, asset criticality, potential impact.",
        "<b>5. Prioritize</b> — determine which vulnerabilities get attention first, considering technical characteristics and business context.",
        "<b>6. Remediate</b> — address vulnerabilities: applying patches, updating software, changing configurations, restricting access, removing unnecessary services, implementing compensating controls.",
        "<b>7. Verify</b> — after remediation, confirm the fix: rescanning, configuration verification, or other validation activities.",
        "<b>8. Monitor</b> — keep watching for new assets, new vulnerabilities, configuration changes, and newly disclosed issues.",

  id:7, num:"08", day:2, title:"Vulnerability Identification & Analysis",
  focus:"Where vulnerabilities come from, the identification stages, analysis factors, and validation.",
  lessons:[
    {
      title:"Identification & Common Sources",
      brief:"Identification finds the weaknesses; sources explain where they creep in.",
      concept:[
        "<b>What is Vulnerability Identification?</b> — the process of discovering weaknesses that could potentially be exploited to compromise the confidentiality, integrity, or availability of an information system. While assessment provides the overall process, identification focuses specifically on finding potential weaknesses within the environment.",
        "<b>Common sources of vulnerabilities:</b>",
        "<b>Outdated or unsupported software</b> — no longer supported or missing security updates; may contain known weaknesses.",
        "<b>Missing security patches</b> — failure to apply updates leaves systems exposed to known vulnerabilities.",
        "<b>Insecure configurations</b> — incorrectly configured settings or disabled controls make systems vulnerable.",
        "<b>Weak authentication and authorization</b> — weak mechanisms or inappropriate permissions allow unauthorized access.",
        "<b>Excessive privileges</b> — users, apps, or services with more permissions than necessary increase compromise impact.",
        "<b>Vulnerable third-party components</b> — external libraries, frameworks, and components pass their flaws to the apps that use them.",
        "<b>Insecure design or implementation</b> — weaknesses introduced during application design, development, or deployment.",
        "<b>Exposed services</b> — unnecessary or improperly protected services increase the attack surface."
      ],
      exampleTitle:"Eight Doors, One Building",
      example:[
        "A clinic server runs an unsupported OS (outdated software), misses two patches, leaves RDP open (exposed service), and grants every intern admin rights (excessive privileges).",
        "Identification names each weakness and traces it to its source — because the fix differs for a patch, a config, and a permission."
      ],

        {q:"Excessive privileges are dangerous because they:",opts:["Slow the system","Increase the impact of a compromise","Improve usability","Reduce log sizes"],a:1},
        {q:"A flaw in an external library used by an app is a:",opts:["Configuration issue","Third-party component vulnerability","Patching success","Physical threat"],a:1},
      ]

    {
      title:"Stages of Identification",
      brief:"Five stages carry a team from unknown assets to validated findings.",
      concept:[
        "Vulnerability identification involves several stages that move security teams from discovering assets to obtaining validated findings.",
        "<b>1. Asset Discovery</b> — identify the systems and resources in scope: servers, applications, databases, network devices, cloud resources.",
        "<b>2. Information Gathering</b> — collect context about each asset: operating system, software versions, installed components, configuration, network exposure, asset ownership.",
        "<b>3. Vulnerability Detection</b> — use tools and techniques to find weaknesses: automated scanners, configuration assessments, application security testing, security reviews, manual techniques. Different techniques find different vuln types.",
        "<b>4. Finding Collection</b> — record each finding with: affected asset, vulnerability description, severity, evidence, recommended remediation.",

    {
      title:"Analyzing a Finding",
      brief:"Never judge a flaw by severity alone — weigh five factors plus context.",
      concept:[
        "<b>What is Vulnerability Analysis?</b> — the process of examining an identified vulnerability to understand its characteristics, exploitability, and potential consequences. A vulnerability should not be evaluated on technical severity alone; environment and business context matter too.",
        "<b>1. Severity</b> — how significant the weakness is: Low, Medium, High, Critical. Frameworks like CVSS communicate technical severity.",
        "<b>2. Exploitability</b> — conditions and difficulty of exploitation: whether remote access is possible, whether authentication is required, whether user interaction is required, complexity of exploitation, availability of exploitation information.",
        "<b>3. Exposure</b> — how accessible the system is. Higher exposure: internet-facing apps, public APIs, externally accessible services. Lower exposure: isolated internal systems, restricted admin networks, systems behind strong access controls.",
        "<b>4. Potential impact</b> — what successful exploitation could cause: unauthorized access, data exposure, data modification, service disruption, loss of confidentiality, integrity, or availability.",

        {q:"Asset criticality means:",opts:["All assets are equal","The same flaw matters more on critical systems","Test systems come first","Only servers count"],a:1},

    {
      title:"Validating Findings",
      brief:"Scanners lie sometimes — validation separates genuine flaws from noise.",
      concept:[
        "Vulnerability assessment tools are valuable, but their results should be reviewed and validated.",
        "<b>What is a False Positive?</b> — a tool reports a vulnerability, but investigation determines it does not actually exist.",
        "<b>What is a False Negative?</b> — a vulnerability exists but is not detected by the assessment process.",
        "<b>Why false negatives matter</b> — they create a false sense of security. Relying only on automated scanning may leave weaknesses unidentified — which is why organizations combine automated tools with manual reviews, configuration assessments, application testing, and other techniques.",
        "<b>Why validation matters — it helps teams:</b> confirm reported vulnerabilities are genuine; reduce false positives; investigate unexpected findings; improve confidence in results; provide accurate remediation information; avoid spending resources on invalid findings."

  id:8, num:"09", day:2, title:"Understanding CVE, CWE & Vulnerability Severity",
  focus:"CVE identifiers, CWE weakness classes, severity characteristics, and CVSS prioritization.",
  lessons:[
    {
      title:"Understanding CVE",
      brief:"One flaw, one name worldwide — how CVE identifiers work and why they matter.",
      concept:[
        "<b>CVE (Common Vulnerabilities and Exposures)</b> is a system used to identify publicly known cybersecurity vulnerabilities using standardized identifiers. A CVE identifier gives security professionals, vendors, researchers, and organizations a common way to refer to a specific vulnerability.",
        "<b>CVE identifier format: CVE-YYYY-NNNN</b> — for example, CVE-2024-12345. Where: CVE indicates it is a Common Vulnerabilities and Exposures identifier; YYYY represents the year associated with the CVE; NNNN represents the unique identifier assigned to the vulnerability.",
        "<b>Why are CVEs important?</b> Without standardized identifiers, different teams or vendors might use different names for the same vulnerability. CVE provides a common reference that helps organizations: identify specific vulnerabilities; search for vulnerability information; correlate findings from different security tools; track vulnerabilities over time; communicate security issues consistently.",
        "<b>Example:</b> suppose a scanner reports 'CVE-2024-12345 detected on Server A'. Teams use that identifier to locate affected products, severity information, references, and available remediation guidance."
      ],
      exampleTitle:"One ID, Whole Story",
      example:[
        "Three tools flag the same flaw three different ways — until the analyst spots CVE-2024-12345 in each report and merges them into one finding.",
        "That ID unlocks the vendor advisory, the severity score, and the patch — everything flows from the identifier."
      ],
      game:{type:"match", title:"Match the CVE Part",
        desc:"Tap a CVE element, then tap what it means.",
        pairs:[
          ["CVE prefix","Marks a Common Vulnerabilities and Exposures ID"],
          ["YYYY (2024)","Year associated with the CVE"],
          ["NNNN (12345)","Unique identifier of the vulnerability"],
          ["CVE-2024-12345","One specific known vulnerability"],
          ["Shared identifier","Lets tools and teams correlate findings"],
        ]},
      quiz:[
        {q:"What does a CVE number uniquely identify?",opts:["A company","One specific publicly disclosed vulnerability","A scanner product","A firewall rule"],a:1},
        {q:"The correct CVE ID format is:",opts:["CVE-2024-12345","CVE-12345-2024","CVE/2024/12345","12345-CVE-2024"],a:0},
        {q:"CVEs help organizations:",opts:["Rename servers","Correlate findings from different tools and track issues over time","Delete vulnerabilities","Skip patching"],a:1},
      ]
    },
    {
      title:"Understanding CWE",
      brief:"If CVE names the flaw, CWE names the family it belongs to.",
      concept:[
        "<b>CWE (Common Weakness Enumeration)</b> is a community-developed classification system for software and hardware weaknesses that can lead to vulnerabilities. While CVE identifies a specific known vulnerability, CWE describes the type or category of weakness associated with it.",
        "<b>Example:</b> consider an application that fails to properly validate user input. The underlying weakness could be classified as a particular CWE category related to improper input validation. A specific vulnerability resulting from that weakness may receive its own CVE identifier.",
        "<b>CVE vs CWE:</b> CVE = one specific known vulnerability instance (CVE-2024-12345). CWE = the weakness class or family it belongs to (e.g., improper input validation).",
        "<b>Why is CWE important?</b> CWE moves teams beyond individual flaws to patterns in how weaknesses are introduced. If an organization repeatedly finds improper-authorization flaws, it signals a broader design or development issue. CWE supports: secure software development, code review, security education, vulnerability analysis, root-cause analysis, and identification of recurring weakness patterns."
      ],
      exampleTitle:"Pattern Behind the Bugs",
      example:[
        "Five separate CVEs across three apps — all traced to one CWE family: improper input validation. The root cause is a shared coding practice, not five coincidences.",
        "Fix the pattern with training and code review, and the whole CWE family shrinks."
      ],
      game:{type:"match", title:"Match CVE vs CWE",
        desc:"Tap a term, then tap what it describes.",
        pairs:[
          ["CVE-2024-12345","One specific vulnerability instance"],
          ["CWE category","The weakness family or type"],
          ["Repeated same-family flaws","Signal a broader design issue"],
          ["CWE in code review","Catch weakness patterns early"],
          ["CVE in a scanner report","Look up severity and remediation"],
        ]},
      quiz:[
        {q:"CWE describes:",opts:["A specific vulnerability instance","The type or category of a weakness","A scanner brand","A firewall rule"],a:1},
        {q:"If many flaws share one CWE family, it suggests:",opts:["Bad luck","A broader design or development issue","Faulty scanners","Too many servers"],a:1},
        {q:"CWE supports all EXCEPT:",opts:["Secure software development","Code review and education","Root-cause analysis","Password recovery"],a:3},
      ]
    },
    {
      title:"Understanding Severity",
      brief:"How bad is it, technically? Categories, characteristics, and the CIA triad.",
      concept:[
        "<b>Vulnerability severity</b> describes the technical seriousness of a vulnerability and the potential consequences of its exploitation. Severity helps teams communicate significance and supports remediation prioritization.",
        "<b>Common severity categories:</b> Informational, Low, Medium, High, Critical. Exact categories and thresholds depend on the scoring system used.",
        "<b>Characteristics that influence severity:</b>",
        "<b>1. Attack Vector</b> — how can it be accessed? Network, adjacent network, local, or physical. Remote network access differs greatly from requiring local access.",
        "<b>2. Attack Complexity</b> — how difficult is exploitation? Some flaws exploit under straightforward conditions; others need specific circumstances.",
        "<b>3. Privileges Required</b> — does the attacker need an account or elevated permissions? No privileges differs from requiring significant access.",
        "<b>4. User Interaction</b> — must another user act (open a file, interact with an app) for exploitation to succeed?",
        "<b>5. Impact</b> — potential effects on Confidentiality (could sensitive info be disclosed?), Integrity (could info be modified?), Availability (could systems become unavailable?). These three form the CIA triad.",
        "<b>Example:</b> Vulnerability A needs local access, user privileges, and has limited impact. Vulnerability B is remotely accessible, needs no authentication, and could badly affect confidentiality, integrity, or availability. The two have very different technical severity."
      ],
      exampleTitle:"A vs B",
      example:[
        "Vuln A: local access, privileges required, limited impact — modest severity. Vuln B: remote, unauthenticated, CIA-wide impact — severe.",
        "Same scanner, same report — but attack vector, privileges, and impact separate a footnote from a fire drill."
      ],
      game:{type:"match", title:"Match the Severity Factor",

        pairs:[

          ["Attack Complexity","How difficult is exploitation?"],
          ["Privileges Required","Does the attacker need an account?"],
          ["User Interaction","Must another user act?"],
          ["Confidentiality impact","Could sensitive info be disclosed?"],
          ["Availability impact","Could systems become unavailable?"],
        ]},
      quiz:[
        {q:"Severity categories from lowest to highest:",opts:["Low, High, Critical","Informational, Low, Medium, High, Critical","Medium, Low, High","Critical, High, Medium, Low"],a:1},
        {q:"The CIA triad stands for:",opts:["Central Intelligence Agency","Confidentiality, Integrity, Availability","Critical Infrastructure Assessment","Cloud, Internet, Access"],a:1},
        {q:"A remotely exploitable flaw with no privileges required is generally:",opts:["Less severe","More severe than one needing local access","Unscorable","Informational only"],a:1},
      ]
    },
    {
      title:"CVSS & Prioritization",
      brief:"Scores measure severity — but context decides priority.",
      concept:[
        "<b>What is CVSS?</b> — the Common Vulnerability Scoring System, a standardized framework for communicating vulnerability severity. CVSS provides a numerical score, ranging from 0.0 to 10.0, that helps organizations understand and compare technical severity.",
        "<b>CVSS score vs organizational risk:</b> CVSS severity is NOT the same as organizational risk. A high-CVSS flaw's real priority depends on environment. Example: System A has a High CVSS flaw but is an isolated internal test system with no sensitive data and strong controls. System B has a Medium CVSS flaw but is internet-facing, business-critical, and handles sensitive information. The organization may prioritize System B. Combine technical severity with environmental and business context — never treat one score as the final answer.",
        "<b>Factors that can influence prioritization:</b> CVSS severity, internet exposure, asset criticality, sensitivity of data, exploitability, availability of a security update, existing security controls, evidence of active exploitation, business impact, regulatory requirements.",
        "<b>Example vulnerability record:</b> Finding — known vulnerability in a web application component. CVE: CVE-202X-XXXXX. CWE: CWE-XXX. CVSS: 8.2 — High. Affected asset: internet-facing customer application. Potential impact: unauthorized access or exposure of sensitive information. Assessment: technical severity is high AND the asset is business-critical — weigh both when setting remediation priority."
      ],
      exampleTitle:"Score High, Priority Low?",
      example:[
        "A 9.8 flaw sits on a powered-off lab VM with no data — technically critical, practically waiting its turn.",
        "A 6.5 flaw faces the internet on the payment API with exploit chatter online — patched tonight. Context beats score."
      ],
      game:{type:"sort", title:"Higher or Lower Priority?",

          ["Strong controls, internal only","Lower Priority"],
        ]},
      quiz:[
        {q:"CVSS scores range from:",opts:["1 to 5","0.0 to 10.0","0 to 100","A to F"],a:1},
        {q:"CVSS severity vs organizational risk:",opts:["They are identical","CVSS is technical severity; real priority needs environment context","Risk ignores CVSS","CVSS measures money"],a:1},
        {q:"Prioritization may consider all EXCEPT:",opts:["Internet exposure and asset criticality","Evidence of active exploitation","Business impact and regulations","The analyst's lunch order"],a:3},
        {q:"A good vulnerability record includes:",opts:["CVE, CWE, CVSS, asset, impact, assessment","Only the CVE number","Only a screenshot","Only the date"],a:0},

  id:9, num:"10", day:2, title:"Basic Web & Service Vulnerability Assessment",
  focus:"Web vs service assessment, six web areas, five service steps, and the reporting process.",
  lessons:[
    {
      title:"Web & Service Assessment Intro",
      brief:"Web apps and network services are the most exposed parts of any organization — learn what each assessment covers.",
      concept:[
        "<b>Web vulnerability assessment</b> is the process of identifying and evaluating security weaknesses in web applications, websites, APIs, and related components.",
        "<b>Web applications commonly interact with:</b> users, databases, APIs, authentication systems, file storage, and external services. Because of these interactions, weaknesses in one component can affect the security of the overall application.",
        "<b>Service vulnerability assessment</b> focuses on network-accessible services running on systems or devices. Examples: web servers, DNS services, mail services, file-sharing services, database services, remote administration services.",
        "<b>Why is this assessment important?</b> Organizations expose web applications and services to users, partners, or the internet. A weakness in an exposed application or service can let an attacker: access unauthorized functionality, obtain sensitive information, disrupt services, compromise accounts, or gain unauthorized access to systems."
      ],
      exampleTitle:"One Weak Link, Whole Chain",
      example:[
        "A clinic's appointment app talks to users, a database, an API, and file storage. A flaw in file uploads alone could expose patient records across the whole chain.",
        "Meanwhile an forgotten mail service on the same network offers a second, quieter way in. Both assessments matter."
      ],

        desc:"Tap each item, then tap which assessment covers it.",

          ["File upload feature","Web Application"],
          ["DNS service","Network Service"],
          ["Mail service","Network Service"],
          ["Database service","Network Service"],
          ["Remote admin service","Network Service"],
        ]},
      quiz:[
        {q:"Web vulnerability assessment evaluates:",opts:["Only passwords","Web apps, websites, APIs and related components","Only firewalls","Only laptops"],a:1},
        {q:"A weakness in one web component can:",opts:["Never spread","Affect the security of the overall application","Improve speed","Fix itself"],a:1},
        {q:"Which is a network-accessible service?",opts:["A login form","A DNS service","A cookie","A URL parameter"],a:1},
        {q:"An exposed-app weakness can let attackers:",opts:["Compromise accounts and access systems","Speed up the site","Reduce hosting costs","Write better code"],a:0},

    {
      title:"Assessing Web Apps: Six Areas",
      brief:"Authentication to info exposure — the six areas every web assessment must cover.",
      concept:[
        "Web applications should be assessed across multiple security areas.",
        "<b>1. Authentication</b> — determines whether a user is who they claim to be. Consider: password requirements, login controls, account lockout mechanisms, multi-factor authentication, session handling. Example: without protected authentication, unauthorized users may gain access to accounts.",
        "<b>2. Authorization</b> — determines what an authenticated user may access. Check whether users can reach functions or data beyond their permissions. Example: a regular user must not reach admin functions by changing a URL or parameter.",
        "<b>3. Input Validation</b> — applications accept input: search fields, login forms, file uploads, API parameters, comments. Input should be validated and handled appropriately to reduce risk.",
        "<b>4. Session Management</b> — sessions maintain authenticated state. Examine whether: sessions are protected, sessions expire appropriately, session identifiers are handled securely, logout properly terminates the session.",
        "<b>5. Security Configuration</b> — review app and server configurations: unnecessary features enabled, excessive information disclosure, insecure security settings, missing security controls.",
        "<b>6. Sensitive Information Exposure</b> — check whether sensitive data leaks through: application responses, error messages, logs, configuration files, publicly accessible resources."
      ],
      exampleTitle:"Six Doors, Six Locks",
      example:[
        "The portal has no lockout (authentication), lets patients view other records by editing an ID (authorization), and echoes database errors (info exposure).",
        "Three areas, three findings — one assessment pass, because the checklist covered all six."
      ],

        pairs:[

          ["Session Management","Are sessions protected and expired?"],
          ["Security Configuration","Are settings hardened, features trimmed?"],
          ["Info Exposure","Does sensitive data leak anywhere?"],

        {q:"Account lockout mechanisms belong to:",opts:["Session management","Authentication","Authorization","Configuration"],a:1},
        {q:"Database errors shown to visitors are:",opts:["Good debugging","Sensitive information exposure","Proper logging","Encryption"],a:1},
        {q:"Logout must:",opts:["Change the theme","Properly terminate the session","Delete the account","Clear the cache only"],a:1},

    {
      title:"Assessing Services: Five Steps",
      brief:"Unnecessary or insecure services widen the attack surface — find, version, check, review, and weigh exposure.",
      concept:[
        "Network services provide functionality, but unnecessary or insecure services increase an organization's attack surface.",
        "<b>1. Identify exposed services</b> — determine which services are accessible in scope: web, database, file-sharing, mail, remote administration services. Unnecessary services should be reviewed and, where appropriate, disabled or restricted.",
        "<b>2. Identify service versions</b> — determine software and versions of exposed services, to learn whether: the software is outdated, the version is supported, known vulnerabilities may apply, security updates are available.",
        "<b>3. Check for known vulnerabilities</b> — compare service and version against trusted sources: CVE information, vendor security advisories, vulnerability databases, security assessment tools. This connects directly to the previous module's concepts.",
        "<b>4. Review configuration</b> — a service may be vulnerable by configuration, not by defect. Review: access controls, authentication, encryption, default settings, unnecessary features, network restrictions.",
        "<b>5. Evaluate exposure</b> — determine who can reach the service. Internet → Service means far greater external exposure than Restricted Internal Network → Service. Weigh exposure alongside asset criticality and severity."
      ],
      exampleTitle:"The Database Nobody Needed",
      example:[
        "Step 1 finds MySQL listening publicly; step 2 versions it as outdated; step 3 matches known CVEs; step 4 finds default credentials; step 5 confirms internet exposure.",
        "Five steps, one verdict: restrict, patch, and re-verify — a textbook service finding."
      ],

/* =========================================================================
   STATE
   ========================================================================= */
let state = {
  view:"home",                 // home | module | lesson | challenge | moduleComplete | badge
  moduleIdx:0,
  lessonIdx:0,
  step:0,                      // 0 brief 1 concept 2 example 3 game 4 quiz
  quizIdx:0,
  xp:0,
  hearts:5,
  completedLessons:new Set(),  // "m-l" keys
  completedModules:new Set(),  // module idx
  history:[],                  // for back button
};
function lessonKey(m,l){return m+"-"+l;}
function isModuleUnlocked(i){return i===0 || state.completedModules.has(i-1);}
function isLessonUnlocked(m,l){
  if(l===0) return true;
  return state.completedLessons.has(lessonKey(m,l-1));
}
function moduleLessonsDone(m){
  return MODULES[m].lessons.every((_,li)=>state.completedLessons.has(lessonKey(m,li)));
}

function go(view, extra){
  state.history.push({view:state.view, moduleIdx:state.moduleIdx, lessonIdx:state.lessonIdx, step:state.step});
  Object.assign(state, {view}, extra||{});
  render();
}
function goBack(){
  if(state.view==="home"){ return; }
  const prev = state.history.pop();
  if(prev){ Object.assign(state, prev); } else { state.view="home"; }
  render();
}
document.getElementById("backBtn").addEventListener("click", goBack);

function addXP(n){ state.xp += n; document.getElementById("xpVal").textContent = state.xp; }
function loseHeart(){
  state.hearts = Math.max(0, state.hearts-1);
  document.getElementById("heartsVal").textContent = state.hearts;
  document.getElementById("heartsVal").parentElement.classList.add("shake");
  setTimeout(()=>document.getElementById("heartsVal").parentElement.classList.remove("shake"),500);
}
function updateTopProgress(){
  const total = MODULES.reduce((a,m)=>a+m.lessons.length+1,0);
  let done=0;
  MODULES.forEach((m,mi)=>{
    m.lessons.forEach((_,li)=>{ if(state.completedLessons.has(lessonKey(mi,li))) done++; });
    if(state.completedModules.has(mi)) done++;
  });
  document.getElementById("topProgress").style.width = Math.round(done/total*100)+"%";
}

/* =========================================================================
   RENDER: ROUTER
   ========================================================================= */
function render(){
  const app = document.getElementById("app");
  updateTopProgress();
  document.getElementById("backBtn").style.visibility = state.view==="home" ? "hidden":"visible";
  if(state.view==="home") return renderHome(app);
  if(state.view==="module") return renderModule(app);
  if(state.view==="lesson") return renderLesson(app);
  if(state.view==="challenge") return renderChallenge(app);
  if(state.view==="lessonComplete") return renderLessonComplete(app);
  if(state.view==="moduleComplete") return renderModuleComplete(app);
}

/* ---------------- HOME ---------------- */
function moduleRowHTML(i){
  const m = MODULES[i];
  const unlocked = isModuleUnlocked(i);
  const done = state.completedModules.has(i);
  const lessonsDone = m.lessons.filter((_,li)=>state.completedLessons.has(lessonKey(i,li))).length;
  return `<div class="module-row ${unlocked?'':'locked'}" data-idx="${i}">
    <div class="m-badge ${done?'done':(unlocked?'':'locked')}">${done?'&#10003;':m.num}</div>
    <div class="m-info">
      <h3>Module ${m.num} — ${m.title}</h3>
      <p>${m.focus}</p>
    </div>
    <div class="m-meta">${lessonsDone}/${m.lessons.length} lessons</div>
    ${done?'<div class="m-check">&#10003;</div>':(unlocked?'':'<div class="m-lock">&#128274;</div>')}
  </div>`;
}
function renderHome(app){
  const totalLessons = MODULES.reduce((a,m)=>a+m.lessons.length,0);
  const doneLessons = state.completedLessons.size;
  const doneModules = state.completedModules.size;
  const day1 = MODULES.map((m,i)=>i).filter(i=>MODULES[i].day===1);
  const day2 = MODULES.map((m,i)=>i).filter(i=>MODULES[i].day===2);
  app.innerHTML = `
    <div class="hero">
      <h1>CyberThulir — 2-Day Workshop</h1>
      <p>Beginner Tier — ethical hacking fundamentals to vulnerability assessment &amp; reporting. Day 1: Modules 01–06 &middot; Day 2: Modules 07–11. No prior cybersecurity knowledge assumed.</p>
      <div class="hero-stats">
        <div><b>${doneModules}/${MODULES.length}</b>Modules complete</div>
        <div><b>${doneLessons}/${totalLessons}</b>Lessons complete</div>
        <div><b>${state.xp}</b>Total XP</div>
      </div>
    </div>
    <div class="day-head"><span>DAY 1 — HACKING FUNDAMENTALS</span><small>Modules 01–06</small></div>
    <div class="path">
      ${day1.map(i=>moduleRowHTML(i)).join("")}
    </div>
    <div class="day-head day2"><span>DAY 2 — VULNERABILITY ASSESSMENT</span><small>Modules 07–11</small></div>
    <div class="path">
      ${day2.map(i=>moduleRowHTML(i)).join("")}
    </div>
  `;
  app.querySelectorAll(".module-row").forEach(el=>{
    el.addEventListener("click",()=>{
      const idx = parseInt(el.dataset.idx);
      if(!isModuleUnlocked(idx)) return;
      go("module", {moduleIdx:idx});
    });
  });
}

/* ---------------- MODULE ---------------- */
function renderModule(app){
  const m = MODULES[state.moduleIdx];
  const allLessonsDone = moduleLessonsDone(state.moduleIdx);
  const moduleDone = state.completedModules.has(state.moduleIdx);
  app.innerHTML = `
    <div class="module-head">
      <div class="kicker">Day ${m.day} &middot; Module ${m.num} &middot; Beginner</div>
      <h2>${m.title}</h2>
      <p>${m.focus}</p>
    </div>
    <div class="lesson-list">
      ${m.lessons.map((l,li)=>{
        const unlocked = isLessonUnlocked(state.moduleIdx, li);
        const done = state.completedLessons.has(lessonKey(state.moduleIdx,li));
        return `<div class="lesson-row ${unlocked?'':'locked'}" data-idx="${li}">
          <div class="l-num ${done?'done':''}">${done?'&#10003;':(li+1)}</div>
          <div style="flex:1">
            <div class="l-title">${l.title}</div>
            <div class="l-sub">${done?'Completed':(unlocked?'Tap to start':'Locked — finish the previous lesson')}</div>
          </div>
        </div>`;
      }).join("")}
    </div>
    <div class="challenge-card ${allLessonsDone?'':'locked'}" id="challengeCard">
      <div class="challenge-icon">&#127919;</div>
      <div style="flex:1">
        <h4>Practical Challenge: ${m.challenge.title} ${moduleDone?'&nbsp;&#10003;':''}</h4>
        <p>${allLessonsDone? "Hands-on simulation — put the module's concepts to work." : "Locked — complete all lessons above first."}</p>
      </div>
    </div>
  `;
  app.querySelectorAll(".lesson-row").forEach(el=>{
    el.addEventListener("click",()=>{
      const li = parseInt(el.dataset.idx);
      if(!isLessonUnlocked(state.moduleIdx, li)) return;
      go("lesson", {lessonIdx:li, step:0, quizIdx:0});
    });
  });
  document.getElementById("challengeCard").addEventListener("click",()=>{
    if(!allLessonsDone) return;
    go("challenge", {});
  });
}

const STEP_META = [
  {label:"MISSION BRIEF", color:"var(--pink)"},
  {label:"CONCEPT", color:"var(--purple)"},
  {label:"REAL-WORLD EXAMPLE", color:"var(--navy-soft)"},
